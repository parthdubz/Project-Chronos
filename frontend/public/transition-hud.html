<!doctype html>
<html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline Clash HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
:root{--bg:#000;--glow:#2a9dff;--dim:#0a3a7a;color-scheme:dark}
html,body{height:100%;background:var(--bg);margin:0}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;padding-inline:16px;box-sizing:border-box}
canvas{width:min(100%,calc((100vh - 32px)*16/9));aspect-ratio:16/9;max-height:100%;display:block}
</style>
<script>document.addEventListener("contextmenu",function(e){e.preventDefault()});</script>
<canvas id="c" aria-label="Animated blue timeline clash diagnostic display" role="img"></canvas>
<script>
const SND=['keys','power','whoosh','hum','ping','rotor'];
const W=1280,H=720,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const C='#2a9dff',CT='#4db3ff',CD='#1450a8',F='"VT323", "Courier New", monospace';
function fit(){const d=Math.min(window.devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
fit();addEventListener('resize',fit);
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const pr=(t,a,d)=>cl((t-a)/d);
const ez=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;

const V=[],E=[];
function ring(cx,cy,cz,r,n,zs,ax){const s=V.length;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+Math.PI/n;const u=Math.cos(a)*r,w=Math.sin(a)*r*zs;V.push(ax?[cx,cy+u,cz+w]:[cx,cy+u,cz+w])}for(let i=0;i<n;i++)E.push([s+i,s+(i+1)%n]);return s}
function link(a,b,n){for(let i=0;i<n;i++)E.push([a+i,b+i])}
const NODES=[-1.0,.2,1.4];
const amp=x=>.46*Math.abs(Math.sin((x+1)*Math.PI/1.2));
const sp=(i,x)=>{const a=x*3.2+i*Math.PI*2/3,r=amp(x);return[x,r*Math.cos(a),r*Math.sin(a)*.8]};
function tube(pts,rad){let p=-1;pts.forEach(([x,y,z])=>{const s=V.length;V.push([x,y-rad,z],[x,y,z+rad],[x,y+rad,z],[x,y,z-rad]);for(let k=0;k<4;k++)E.push([s+k,s+(k+1)%4]);if(p>=0)link(p,s,4);p=s})}
for(let i=0;i<3;i++){const pts=[];for(let x=-1.35;x<=1.52;x+=.06)pts.push(sp(i,x));tube(pts,.035)}
const fork=(x0,x1,y1,z1)=>{const pts=[];for(let k=0;k<=14;k++){const u=k/14,e=u*u;pts.push([x0+(x1-x0)*u,y1*e,z1*e])}tube(pts,.028);return pts[14]};
const F1=fork(.2,1.25,.72,.42),F2=fork(-1,-1.38,-.62,.3),F3=fork(1.4,.85,-.7,-.3);
{const s=V.length;V.push([-1.45,0,0],[1.62,0,0]);E.push([s,s+1]);for(let x=-1.4;x<=1.6;x+=.2){const t=V.length;V.push([x,0,-.05],[x,0,.05],[x,-.05,0],[x,.05,0]);E.push([t,t+1],[t+2,t+3])}}
NODES.forEach(nx=>{const c=V.length;V.push([nx,0,0]);for(let k=0;k<10;k++){const a=k/10*Math.PI*2,r=k%2?.12:.22;V.push([nx+(k%3-1)*.05,Math.cos(a)*r,Math.sin(a)*r]);E.push([c,V.length-1])}ring(nx,0,0,.16,10,1)});

function proj(p,a,b,cx,cy,s){const[x,y,z]=p;const y1=y*Math.cos(a)-z*Math.sin(a),z1=y*Math.sin(a)+z*Math.cos(a);const x2=x*Math.cos(b)-y1*Math.sin(b),y2=x*Math.sin(b)+y1*Math.cos(b);const f=6/(6+y2);return[cx+x2*s*f,cy-z1*s*f]}
function ship(a,b,cx,cy,s,lw=1.1,al=1){const P=V.map(p=>proj(p,a,b,cx,cy,s));ctx.globalAlpha=al;ctx.lineWidth=lw;ctx.strokeStyle=C;ctx.beginPath();for(const[i,j]of E){ctx.moveTo(P[i][0],P[i][1]);ctx.lineTo(P[j][0],P[j][1])}ctx.stroke();ctx.globalAlpha=1}

const TS=[];
(function br(p,d,ph){if(d>4)return;const len=d?.55:.7,sp=d?.78*Math.pow(.6,d-1):0;const kids=d?[ph,ph+Math.PI]:[0];kids.forEach(k=>{const q=[p[0]+len,p[1]+Math.cos(k)*sp,p[2]+Math.sin(k)*sp];const pts=[];for(let s=0;s<=10;s++){const u=s/10,e=u*u*(3-2*u);pts.push([p[0]+len*u,p[1]+(q[1]-p[1])*e,p[2]+(q[2]-p[2])*e])}TS.push({d,pts,q});br(q,d+1,ph+Math.PI/2)})})([-1.45,0,0],0,Math.PI/2);
function tree(t,cx,cy,s,al){const a=t*.7,b=.35*Math.sin(t*.5)+.25,g=pr(t,1.2,1.6)*5.2;ctx.globalAlpha=al;ctx.strokeStyle=C;ctx.fillStyle=CT;
TS.forEach(({d,pts,q},i)=>{const f=cl(g-d);if(f<=0)return;const n=Math.max(1,Math.round(f*10));const P=pts.slice(0,n+1).map(p=>proj(p,a,b,cx,cy,s));ctx.lineWidth=d<2?1.8:1.1;ctx.beginPath();P.forEach(([x,y],k)=>k?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();
if(f>=1){const[x,y]=proj(q,a,b,cx,cy,s);ctx.beginPath();ctx.arc(x,y,d==4?2.2:3.2,0,Math.PI*2);d==4?ctx.fill():ctx.stroke();const u=((t*.9-d*.22+i*.07)%1+1)%1;const[px,py]=proj(pts[Math.floor(u*10)],a,b,cx,cy,s);ctx.fillRect(px-1.5,py-1.5,3,3)}});
if(g>5){const tp=TS.filter(o=>o.d==4);[[3,6],[9,12]].forEach(([i,j])=>{const A=proj(tp[i].q,a,b,cx,cy,s),B=proj(tp[j].q,a,b,cx,cy,s);if(Math.hypot(A[0]-B[0],A[1]-B[1])<26&&Math.sin(t*10)>0){ctx.beginPath();ctx.arc((A[0]+B[0])/2,(A[1]+B[1])/2,9,0,Math.PI*2);ctx.stroke()}})}
ctx.globalAlpha=1}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function frame(x,y,w,h,r,t,t0,d=.5,lw=2){const p=pr(t,t0,d);if(p<=0)return false;const L=2*(w+h);ctx.setLineDash([L*ez(p),L]);ctx.lineWidth=lw;ctx.strokeStyle=C;rr(x,y,w,h,r);ctx.stroke();ctx.setLineDash([]);return p>=1}
function type(s,x,y,t,t0,cps=40,al='left',sz=26,mw=9999,col=CT){if(t<t0)return;const n=Math.min(s.length,Math.floor((t-t0)*cps));typed+=n;ctx.font=sz+'px '+F;ctx.fillStyle=col;ctx.textAlign=al;let str=s.slice(0,n);const fw=ctx.measureText(s).width,k=Math.min(1,mw/fw);ctx.fillText(str,x,y,ctx.measureText(str).width*k);if(n<s.length&&n>0&&al==='left'){const w=ctx.measureText(str).width*k;ctx.fillRect(x+w+2,y-sz*.7,sz*.4,sz*.75)}}
function hline(x1,x2,y,t,t0,d=.4,dash){const p=pr(t,t0,d);if(p<=0)return;ctx.lineWidth=1.5;ctx.strokeStyle=C;if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x1+(x2-x1)*ez(p),y);ctx.stroke();ctx.setLineDash([])}

const calls=[
[F1,'BRANCH COLLAPSE',[-30,70]],
[sp(0,-.4),'CAUSAL LOOP',[30,-120]],
[[.2,0,0],'NEXUS EVENT',[40,-110]],
[[1.4,0,0],'TEMPORAL BREACH',[-20,110]],
[sp(2,.8),'ANCHOR LOST',[20,-60]],
[sp(1,-.45),'TIMELINE FRACTURE',[30,100]],
[[-1,0,0],'PRIME TIMELINE',[16,-80]]];

const noise=[...Array(70)].map(()=>[Math.random()*Math.PI*2,Math.sqrt(Math.random())*84,Math.random()*3+1]);
const glyphs=[...Array(36)].map(()=>Math.floor(Math.random()*4));

const grid=document.createElement('canvas');grid.width=grid.height=4;{const g=grid.getContext('2d');g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,3,4,1);g.fillRect(3,0,1,4)}
let pat=null;

let typed=0,lastTyped=0,lastTick=0,prevT=-1,AC=null,MG=null,BUF={},soundOn=false;
const EV=[[0,'power',1,2.4],[.9,'whoosh',.55],[1.75,'whoosh',.6],[2,'hum',.5,0,4.2],[2.4,'ping',.32],[3.6,'ping',.28],[4.8,'ping',.24],[6.95,'whoosh',.55],[7.3,'rotor',.1],[9.55,'whoosh',.5]];
function initAudio(){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.connect(AC.destination);
const sl=AC.createBufferSource();sl.buffer=AC.createBuffer(1,1,22050);sl.connect(AC.destination);sl.start(0);AC.resume();
return Promise.all(SND.map(k=>fetch('/sounds/transition/'+k+'.mp3').then(r=>r.arrayBuffer()).then(buf=>new Promise(res=>{
try{const p=AC.decodeAudioData(buf,b=>{BUF[k]=b;res()},e=>{console.warn('decode',k,e);res()});if(p&&p.catch)p.catch(()=>res())}catch(e){res()}})).catch(()=>{})))}
function play(k,vol,_,dur){const b=BUF[k];if(!b||!soundOn)return;const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=vol;s.connect(g).connect(MG);const n=AC.currentTime;if(dur){s.loop=true;g.gain.setValueAtTime(vol,n+dur-.35);g.gain.linearRampToValueAtTime(0,n+dur);s.start(n);s.stop(n+dur+.05)}else s.start(n)}
function tick(){if(!soundOn||!BUF.keys)return;const s=AC.createBufferSource(),g=AC.createGain();s.buffer=BUF.keys;s.playbackRate.value=.92+Math.random()*.16;g.gain.value=.22;s.connect(g).connect(MG);s.start(AC.currentTime,Math.random()*Math.max(0,BUF.keys.duration-.12),.1)}
function audioTick(T,now){if(T<prevT){prevT=-1;lastTyped=0}
EV.forEach(([at,k,v,,d])=>{if(prevT<at&&T>=at)play(k,v,0,d)});
if(typed>lastTyped&&now-lastTick>55){tick();lastTick=now}lastTyped=typed;prevT=T}
const LOOP=17.5;
let start=performance.now();
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
initAudio().then(()=>{soundOn=true;start=performance.now();prevT=-1}).catch(()=>{});

function draw(now){
const T=still?14:Math.min((now-start)/1000,LOOP), t=T;
typed=0;ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
ctx.shadowBlur=0;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
const fade=1-pr(t,16.8,.6);ctx.globalAlpha=1;
ctx.save();ctx.globalAlpha=fade;
ctx.shadowColor='rgba(20,130,255,.85)';ctx.shadowBlur=10;
ctx.lineJoin='round';

/* menu */
{const p=ez(pr(t,0,.6));if(p>0){const cx=640,hw=600*p;ctx.lineWidth=2.2;ctx.strokeStyle=C;rr(cx-hw,22,hw*2,32,16);ctx.stroke()}
['HOME','FILE','EDIT','RUN','BUILD','SETTINGS'].forEach((s,i)=>type(s,150+i*196,46,t,.4+i*.08,30,'center',24,120))}

/* small placeholder box then diag panel */
if(t<.9&&t>.35){ctx.lineWidth=2;ctx.strokeStyle=C;ctx.strokeRect(615,330,70,50)}
ctx.save();ctx.translate(-22,-88);
const dg=['TIMELINE DIAGNOSTIC','> STABILITY:','> SYNC:','> CAUSALITY:','> BRANCHES:','> DRIFT:','> ANCHOR:'],dv=['','33%','24%','56%','67%','43%','17%'],dy=[172,204,240,258,276,310,328];
dg.forEach((s,i)=>{type(s,134,dy[i],t,.8+i*.12,45,'left',i?24:25,i?128:176);if(dv[i]&&t>1.1+i*.12){ctx.font='24px '+F;ctx.textAlign='right';ctx.fillStyle=CT;ctx.fillText(dv[i],308,dy[i])}});
hline(134,308,182,t,.9);hline(134,308,216,t,1.1,.4,[3,3]);hline(134,308,288,t,1.3,.4,[3,3]);hline(134,312,344,t,1.5);
{const p=pr(t,.8,.8);for(let c=0;c<2;c++)for(let i=0;i<26;i++){if(i/26>p)continue;const fl=Math.sin(t*6+i*.7+c*2)>.85?.35:1;ctx.globalAlpha=fade*fl;ctx.fillStyle=C;ctx.fillRect(68+c*28,340-i*7,22,4)}ctx.globalAlpha=fade}
if(frame(62,354,256,34,6,t,1.5,.4,1.5)||t>1.5){const blink=t<6||Math.floor(t*2)%2?1:.35;ctx.globalAlpha=fade*blink;type('PARADOX ALERT ACTIVE',72,380,t,1.7,40,'left',26,236);ctx.globalAlpha=fade}

ctx.restore();
/* thumb */
if(frame(40,326,324,370,14,t,.9,.5)||t>.9){if(t>1.2){ctx.save();ctx.shadowBlur=4;ctx.strokeStyle=CD;ctx.lineWidth=1.5;for(let r=0;r<6;r++)for(let c=0;c<6;c++){const x=66+c*53,y=354+r*62;ctx.beginPath();ctx.moveTo(x-6,y);ctx.lineTo(x+6,y);ctx.moveTo(x,y-6);ctx.lineTo(x,y+6);ctx.stroke()}ctx.restore();
ctx.save();rr(42,328,320,366,12);ctx.clip();tree(t,194,511,80,fade);ctx.restore()}}

/* main scan panel */
const mx=380,my=70,mw=540,mh=626;
if(frame(mx,my,mw,mh,14,t,1.8,.6)||t>1.8){
const a=.06+1.24*ez(pr(t,2.6,3.2)),b=.12*Math.sin(t*.6);
ctx.save();rr(mx+2,my+2,mw-4,mh-4,12);ctx.clip();
if(t>2.1)ship(a,b,636,370,170,1.1,pr(t,2.1,.5));
if(t>2.3&&t<6.3){const s=pr(t,2.3,4);const vx=mx+40+(mw-80)*(.5+.5*Math.sin(s*Math.PI*2.2-1.4)),hy=my+60+(mh-140)*(.5+.5*Math.sin(s*Math.PI*1.4+2));ctx.lineWidth=2.2;ctx.strokeStyle=C;ctx.beginPath();ctx.moveTo(vx,my+30);ctx.lineTo(vx,my+mh-40);ctx.moveTo(mx+30,hy);ctx.lineTo(mx+mw-30,hy);ctx.stroke()}
ctx.restore();
if(t>2.3&&t<6.4){const n=Math.floor(pr(t,2.3,3.8)*62);ctx.fillStyle=C;for(let i=0;i<n;i++)ctx.fillRect(mx+20+i*8,my+mh-34,5,16)}
if(t>6.3){calls.forEach(([p,lab,[ox,oy]],i)=>{const st=6.4+i*.16,q=pr(t,st,.35);if(q<=0)return;const[px,py]=proj(p,a,b,636,370,170);const ex=px+ox,ey=py+oy,dir=ox>=0?1:-1;const tw=(lab.length*7.2+8);ctx.lineWidth=1.3;ctx.strokeStyle=C;ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(px+dir*6*Math.sign(ox||1)*0,py);const mxp=px+(ex-px)*ez(q),myp=py+(ey-py)*ez(q);ctx.moveTo(px,py);ctx.lineTo(mxp,myp);if(q>=1){ctx.lineTo(ex+dir*tw,ey)}ctx.stroke();if(q>=1){type(lab,dir>0?ex+4:ex-tw+4,ey-4,t,st+.35,50,'left',15,tw-6)}})}
type('Scan Complete',mx+38,mh+my-14,t,6.2,30,'left',26,170);
type('Generating Clash Report',mx+mw-26,mh+my-14,t,7,40,'right',26,265);
}

/* ring panel */
ctx.save();ctx.translate(890,-788);
const rx=198,ry=990;
if(frame(62,858,272,274,14,t,7,.5)||t>7){
const p=ez(pr(t,7.3,1.2));if(p>0){ctx.lineWidth=2;ctx.strokeStyle=C;const rot=t*.15;ctx.beginPath();ctx.arc(rx,ry,112,rot,rot+Math.PI*2*p);ctx.stroke();ctx.beginPath();ctx.arc(rx,ry,94,-rot,-rot+Math.PI*2*p);ctx.stroke();ctx.lineWidth=1;ctx.beginPath();ctx.arc(rx,ry,88,0,Math.PI*2*p);ctx.stroke();
for(let i=0;i<36;i++){const an=rot+i/36*Math.PI*2;if(i/36>p)break;const g=glyphs[i],r0=97,r1=109;ctx.save();ctx.translate(rx+Math.cos(an)*103,ry+Math.sin(an)*103);ctx.rotate(an+Math.PI/2);ctx.lineWidth=1.3;ctx.beginPath();if(g==0){ctx.moveTo(-3,-4);ctx.lineTo(3,4);ctx.moveTo(3,-4);ctx.lineTo(-3,4)}else if(g==1){ctx.arc(0,0,3.5,0,Math.PI*2)}else if(g==2){ctx.moveTo(-4,3);ctx.lineTo(0,-4);ctx.lineTo(4,3)}else{ctx.moveTo(-4,-3);ctx.lineTo(4,-3);ctx.moveTo(0,-3);ctx.lineTo(0,4)}ctx.stroke();ctx.restore()}
for(let i=0;i<4;i++){const an=-Math.PI/2+i*Math.PI/2+rot;if(p<1)break;ctx.fillStyle=C;ctx.save();ctx.translate(rx+Math.cos(an)*117,ry+Math.sin(an)*117);ctx.rotate(an+Math.PI/2);ctx.beginPath();ctx.moveTo(-8,-3);ctx.lineTo(8,-3);ctx.lineTo(0,6);ctx.closePath();ctx.fill();ctx.restore()}}
const k=pr(t,9.2,1);if(k>0){const burst=k<1?1+.35*Math.sin(k*Math.PI):1;const R=86*ez(Math.min(1,k*1.4))*burst;ctx.save();ctx.beginPath();ctx.arc(rx,ry,Math.min(R,88),0,Math.PI*2);ctx.clip();const g=ctx.createRadialGradient(rx-10,ry-10,4,rx,ry,88);g.addColorStop(0,'rgba(90,190,255,.95)');g.addColorStop(.6,'rgba(20,110,240,.85)');g.addColorStop(1,'rgba(5,40,140,.9)');ctx.fillStyle=g;ctx.fillRect(rx-90,ry-90,180,180);ctx.shadowBlur=0;ctx.strokeStyle='rgba(170,220,255,.25)';ctx.lineWidth=1.5;for(let j=1;j<9;j++){ctx.beginPath();for(let s=0;s<=60;s++){const an=s/60*Math.PI*2,rr2=j*10+2.5*Math.sin(an*5+t*2.4+j)+1.5*Math.sin(an*9-t*3);const X=rx+Math.cos(an)*rr2,Y=ry+Math.sin(an)*rr2;s?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}ctx.stroke()}
ctx.fillStyle='rgba(200,235,255,.35)';noise.forEach(([an,r,sz],j)=>{const tw=.5+.5*Math.sin(t*4+j);ctx.globalAlpha=fade*tw;ctx.fillRect(rx+Math.cos(an+t*.2)*r,ry+Math.sin(an+t*.2)*r,sz,sz)});ctx.restore();ctx.globalAlpha=fade}
type('> Rift Stabilized',rx,1122,t,10.2,30,'center',17,240);
}

ctx.restore();
/* report */
ctx.save();ctx.translate(588,-498);
type('TIMELINE CLASH REPORT',646,874,t,7.6,40,'right',26,290);
hline(352,650,886,t,7.9);
const rp=[['BRANCHES DETECTED:','13',912],['NEXUS COLLISIONS:','3',930],['TIMELINES MERGED:','1',948],['PARADOXES:','0',982],['MAJOR DIVERGENCE:','1',1000],['MINOR DIVERGENCE:','5',1018]];
rp.forEach(([l,v,y],i)=>{type(l,604,y,t,8.1+i*.2,60,'right',24,250);if(t>8.4+i*.2){ctx.textAlign='right';ctx.fillText(v,646,y)}});
hline(352,650,960,t,8.6,.4,[3,3]);hline(346,640,1028,t,9.4);
ctx.restore();
if(frame(934,550,306,146,12,t,9.6,.4)||t>9.6){['RECOMMENDED ACTION:','> Prune rogue branch via Portal','> Seal the causal loop','> Re-anchor prime timeline'].forEach((s,i)=>type(s,950,586+i*32,t,9.9+i*.45,38,'left',i?22:24,276))}

ctx.restore();
ctx.shadowBlur=0;
if(!pat)pat=ctx.createPattern(grid,'repeat');
ctx.fillStyle=pat;ctx.fillRect(0,0,W,H);
const vg=ctx.createRadialGradient(W/2,H/2,W*.25,W/2,H/2,W*.62);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
ctx.fillStyle=`rgba(30,140,255,${.012+.012*Math.random()})`;ctx.fillRect(0,0,W,H);
const sy=(now/7)%(H+200)-100;const sg=ctx.createLinearGradient(0,sy-60,0,sy);sg.addColorStop(0,'rgba(40,150,255,0)');sg.addColorStop(1,'rgba(40,150,255,.04)');ctx.fillStyle=sg;ctx.fillRect(0,sy-60,W,60);
audioTick(T,now);
if(!still&&T<LOOP)requestAnimationFrame(draw);
}
(document.fonts?document.fonts.load('26px VT323').catch(()=>{}):Promise.resolve()).then(()=>requestAnimationFrame(draw));
</script>

</html>
